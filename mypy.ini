# mypy — the type checker, at --strict. Root only, like every other lint config
# here.
#
# Rust gets this from the compiler; Python has to opt in, and opting in on a
# mature codebase is a choice about how far to go. The answer here is: all the
# way. Every function in backend/, run.py, cli.py and scripts/ is annotated,
# every generic is parameterised, and mypy is fatal in scripts\lint.ps1.
#
# It was worth doing for more than the ratchet. Guessing a return type wrong is
# an error mypy reports, so annotating 460 signatures turned into a review of
# what they actually return: _current_players returns a 4-tuple where the name
# suggests 3, kd_hs returns five values of which two can be None, and
# fetch_rank was declared to return nothing while returning a pair.
[mypy]
python_version = 3.12
files = backend, run.py, cli.py, scripts
strict = True

# Three relaxations, each with its reason.

# Every one of the forty-five sites this fires on returns a value pulled
# straight out of Riot's JSON or an untyped cache dict, which is Any by
# construction. A cast() at each would assert something no one has checked and
# add a line of syntax to say it.
warn_return_any = False

# pypresence ships no stubs, so discord_presence's Presence subclass reads as
# subclassing Any. The alternative is writing stubs for a package this calls
# four methods on.
disallow_subclassing_any = False

# Flask's @app.get and friends are untyped in its own package. Every view is
# annotated -> ResponseReturnValue regardless, which is the type Flask
# documents.
disallow_untyped_decorators = False

# No stubs exist for valclient, pypresence, ably or flask_cors.
ignore_missing_imports = True
